name: docker
# ghcr.io/unseenet/helpbot (Dockerfile, README "In Docker"): published for release tags
# only - never on every merge - through the shared workflow (unseenet/unseenet#571);
# a pull request that changes the image only builds and tests it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "compose.yaml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: unseenet/.github/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: ghcr.io/unseenet/helpbot
      test: |
        set -eux
        docker run --rm "$TEST_IMAGE" --help
        docker volume create ci
        docker run --rm -v ci:/data "$TEST_IMAGE" && exit 1 || test $? -eq 64     # example config written
        docker run --rm -v ci:/data "$TEST_IMAGE" sh -c 'grep -qx "base_url = \"http://ollama:11434/v1\"" /data/helpbot.toml'
        docker run --rm -v ci:/data "$TEST_IMAGE" sh -c 'sed -i "s#^group = .*#group = \"unseenet.help@ph5fc5hop5232qsz\"#" /data/helpbot.toml'
        docker run --rm -v ci:/data -e UNSEENET_VAULT_PASSPHRASE=ci "$TEST_IMAGE" init
        test "$(docker run --rm -v ci:/data "$TEST_IMAGE" sh -c 'id -u')" = 10001
