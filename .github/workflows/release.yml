name: release
# Push a tag like v0.1.0 to release (v0.1.1a1 for a test release: GitHub
# marks it as a pre-release). The tag must match __version__ and, for a full
# release, have a section in CHANGELOG.md, which becomes the release notes - the
# shared release workflows (unseenet/unseenet#545).
# Versioning as in unseenet: https://github.com/unseenet/unseenet/blob/main/docs/development.md#versioning
#
# Each release also carries unseenet-helpbot-<version>-server-requirements.txt and
# SHA256SUMS.txt. Once the project key has signed them (tools/project/sign_release.py
# --repo unseenet-helpbot <tag> in unseenet/unseenet), servers running helpbot update
# to it by themselves (unseenet/unseenet#827, UN-RFC 0062 section 6.1).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: unseenet/.github/.github/workflows/release-build.yml@main
    with:
      package: unseenet_helpbot
      server: true
      pypi: false                # named by its wheel in this release

  github:
    needs: build
    uses: unseenet/.github/.github/workflows/release-github.yml@main
    with:
      title: "Unseenet help bot"
      server: true
    permissions:
      contents: write
