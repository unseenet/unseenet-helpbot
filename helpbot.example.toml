# Copy to helpbot.toml. The vault's passphrase comes from UNSEENET_VAULT_PASSPHRASE.

[bot]
vault = "~/.local/share/unseenet-helpbot/helpbot.vault"
group = "unseenet.help@<owner fingerprint>"
name = "Unseenet help (bot)"
# local folders of Markdown, on top of what [github] brings (e.g. a checkout you are editing)
docs = []
state_file = "~/.local/state/unseenet-helpbot/state.json"
# nodes = ["xyz.onion"]                  # default: Unseenet's list of known nodes
triggers = ["@helpbot"]                  # answer when a post names the bot like this
answer_unanswered_after_minutes = 30     # a new thread nobody answered; 0 = only when asked
answer_unanswered_chat_after_minutes = 10   # a chat line that asks something, nobody answered
max_per_hour = 10
max_per_thread = 3
poll_seconds = 120
# ripen_to = 4      # the key's ripening level (UN-RFC 0025); default UNSEENET_RIPEN_TO, else 3.
                    # 4 takes two to three weeks of one core, then every answer costs about
                    # a quarter of the postage - worth it for a bot that answers a lot
learn_from_threads = true                # earlier questions people answered are sources too
# ignore_keys = ["<key text>"]

[github]
# every public repository of the organisation: Markdown files, issues and pull requests.
# The list of repositories is read at every sync, so new ones come by themselves.
org = "unseenet"
refresh_hours = 6
issues = true
# exclude = ["some-experiment"]
# A read-only token (fine-grained, public repositories) in this environment variable:
# needed past GitHub's 60 requests an hour, and for the comments on issues and PRs (#15) -
# the last two of each and every decision by a member ("accepted", "going with",
# "not planned" ...), fetched since the last sync. Without one: no comments.
# token_env = "HELPBOT_GITHUB_TOKEN"
cache_file = "~/.local/state/unseenet-helpbot/github.json"

[model]
# any OpenAI-style server: Ollama (default), llama.cpp's llama-server (http://127.0.0.1:8080/v1),
# or - if you accept that questions then leave Tor - a remote API
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b"
rewrite_query = true                     # let the model turn the question into English keywords first
timeout = 300
# api_key_env = "HELPBOT_API_KEY"

[news]
# The bot tells about releases in plain language in its own feed (#13), and answers the
# comments under its posts. Off until the group exists (unseenet-helpbot#21); check the
# text first with:  unseenet-helpbot -c helpbot.toml news --dry-run
enabled = false
group = "unseenet.help.news@ph5fc5hop5232qsz"
gather_hours = 2        # releases this close together are one post (0.6.0: core, clients ...)
max_tries = 3           # if the model fails, try again this many times, then leave it
