[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-helpbot"
version = "0.1.0.dev0"
description = "A bot that answers questions in the Unseenet help group from the docs, with a local model"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet @ git+https://github.com/unseenet/unseenet.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
unseenet-helpbot = "unseenet_helpbot.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
