[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-helpbot"
dynamic = ["version"]
description = "A bot that answers questions in the Unseenet help group from the docs, with a local model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet>=0.5,<0.6",   # one minor version of the core at a time
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
unseenet-helpbot = "unseenet_helpbot.runner:main"

[project.urls]
Homepage = "https://github.com/unseenet/unseenet-helpbot"

[tool.setuptools.dynamic]
version = { attr = "unseenet_helpbot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unseenet_helpbot = ["*.webp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
